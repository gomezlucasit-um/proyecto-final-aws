<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valheim Server Manager · Universidad de Montevideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Identidad: colores institucionales de la Universidad de Montevideo (azul y dorado del logo). */
  :root {
    --um-blue: #005496; --um-blue-dark: #003c6e; --um-gold: #ae822d;
    --bg: #f4f6fa; --fg: #16233a; --muted: #5a6478; --rule: #d7dde8; --box: #ffffff;
    --accent: var(--um-blue); --accent-hover: var(--um-blue-dark);
    --ok: #1f7a4d; --warn: #b7791f; --off: #6b7280; --err: #b42318;
    --font-title: "League Spartan", "Spartan", "Segoe UI", system-ui, sans-serif;
    --font-body: "Lora", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1724; --fg: #e6eaf2; --muted: #9aa5ba; --rule: #273246; --box: #171f30;
            --accent: #3b86d1; --accent-hover: #5a9ddd; --um-gold: #d2a44a;
            --ok: #4ade80; --warn: #fbbf24; --off: #9ca3af; --err: #f87171; }
    .brand img { background: #fff; border-radius: 8px; padding: 6px 10px; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; padding-bottom: 18px; margin-bottom: 22px; border-bottom: 3px solid var(--um-gold); }
  .brand { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .brand img { height: 52px; width: auto; display: block; }
  .brand .sep { width: 1px; height: 44px; background: var(--rule); }
  h1 { margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; }
  header .sub { margin-top: 4px; }
  button { font: inherit; font-family: var(--font-title); font-weight: 600; font-size: 15px; border: 1px solid var(--rule); background: var(--box); color: var(--fg); border-radius: 6px; padding: 9px 16px 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; color: var(--muted); padding: 4px 6px; text-decoration: underline; font-family: var(--font-body); font-weight: 400; font-size: 14px; }
  button.link:hover:not(:disabled) { color: var(--accent); }
  button.link.danger:hover:not(:disabled) { color: var(--err); }
  button.danger:not(.link) { border-color: var(--err); color: var(--err); }
  .grid { display: grid; gap: 16px; }
  .card { background: var(--box); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; }
  .card.gold { border-top-color: var(--um-gold); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .name { font-family: var(--font-title); font-size: 22px; font-weight: 700; color: var(--accent); }
  .name .sub { font-family: var(--font-body); font-weight: 400; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 3px; border-radius: 999px; font-family: var(--font-title); font-size: 13px; font-weight: 600; letter-spacing: .02em; border: 1px solid currentColor; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .RUNNING { color: var(--ok); } .STARTING, .STOPPING, .CREATING, .DELETING { color: var(--warn); } .STOPPED { color: var(--off); } .ERROR { color: var(--err); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; font-size: 14px; }
  .facts b { display: block; font-family: var(--font-title); font-weight: 600; color: var(--um-gold); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  code { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 14px; }
  .addr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  header .actions { margin-left: auto; }
  .events { border-top: 1px solid var(--rule); padding-top: 10px; font-size: 13.5px; display: grid; gap: 4px; }
  .events[hidden] { display: none; }
  .events div { display: grid; grid-template-columns: 150px 110px 1fr; gap: 10px; }
  .addr code { word-break: break-all; }
  .events time, .events .k { color: var(--muted); }
  .events .k { font-family: var(--font-title); font-weight: 600; font-size: 12.5px; letter-spacing: .03em; }
  .msg { padding: 10px 14px; border-radius: 8px; background: var(--box); border: 1px solid var(--rule); font-size: 14px; }
  .msg.err { border-color: var(--err); color: var(--err); }
  .msg.ok { border-color: var(--ok); color: var(--ok); }
  form.cfg { display: grid; gap: 12px; max-width: 560px; }
  form.cfg label { display: grid; gap: 4px; font-size: 14px; }
  form.cfg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form.cfg input, form.cfg select { font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--box); color: var(--fg); width: 100%; box-sizing: border-box; }
  form.cfg input:focus, form.cfg select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  form.cfg small { color: var(--muted); font-size: 12.5px; }
  #create:empty { display: none; }
  #create { margin-bottom: 16px; }
  footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; }
  footer b { font-family: var(--font-title); font-weight: 600; color: var(--accent); }
  @media (max-width: 560px) { .events div { grid-template-columns: 1fr; gap: 0; } .brand .sep { display: none; } .brand img { height: 44px; } h1 { font-size: 22px; } form.cfg .two { grid-template-columns: 1fr; } }
</style>
</head>

      <span class="sep" aria-hidden="true"></span>
      <div>
        <h1>Valheim Server Manager</h1>
        <div class="sub">Prendemos los servidores cuando alguien quiere jugar y se apagan solos cuando no queda nadie</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="newServer">Nuevo servidor</button>
      <button id="refresh">Actualizar</button>
      <button class="link" id="reconfig">Configurar API</button>
    </div>
  </header>
  <div id="create"></div>
  <div id="app" class="grid"></div>
  <footer>
    <span><b>Introducción a AWS Cloud</b> · Universidad de Montevideo</span>
    <span>Proyecto final de Lucas Gómez y Martín Bentura · AWS Academy Learner Lab · us-east-1</span>
  </footer>
</div>

<script>
// Configuracion fija (opcional). Si se dejan vacios, el panel pide los datos la primera vez.
const API_URL_FIXED = "";   // ej. "https://abc123.execute-api.us-east-1.amazonaws.com"  (Output ApiUrl del stack 03-control)
const API_KEY_FIXED = "";   // el parametro ApiKey del stack 03-control

const app = document.getElementById('app');
const createBox = document.getElementById('create');
let cfg = loadCfg();
let timer = null;
const openEvents = new Set();      // servidores con el historial desplegado
const confirmDelete = new Set();   // servidores con la confirmacion de borrado abierta
const cardMsg = new Map();         // mensajes por servidor (errores de la API)

function loadCfg() {
  try {
    const saved = JSON.parse(localStorage.getItem('valheim-cfg') || '{}');
    return { url: API_URL_FIXED || saved.url || '', key: API_KEY_FIXED || saved.key || '' };
  } catch { return { url: API_URL_FIXED, key: API_KEY_FIXED }; }
}
function saveCfg(c) { try { localStorage.setItem('valheim-cfg', JSON.stringify(c)); } catch {} }

function showConfig(msg) {
  clearInterval(timer); createBox.innerHTML = '';
  app.innerHTML = `
    <div class="card">
      <div class="name">Conectar con la API</div>
      ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
      <form class="cfg" id="cfgForm" autocomplete="off">
        <label><span>URL de la API (Output <code>ApiUrl</code> del stack 03-control)</span>
          <input id="url" required placeholder="https://xxxxx.execute-api.us-east-1.amazonaws.com" value="${esc(cfg.url)}"></label>
        <label><span>Clave (parámetro <code>ApiKey</code> del stack 03-control)</span>
          <input id="key" required type="password" autocomplete="new-password" value="${esc(cfg.key)}"></label>
        <div class="actions"><button class="primary" type="submit">Guardar y conectar</button></div>
        <div class="sub">Se guarda solo en este navegador.</div>
      </form>
    </div>`;
  document.getElementById('cfgForm').onsubmit = (e) => {
    e.preventDefault();
    cfg = { url: document.getElementById('url').value.trim().replace(/\/$/, ''), key: document.getElementById('key').value.trim() };
    saveCfg(cfg); start();
  };
}

async function api(path, method = 'GET', body) {
  const headers = { 'x-api-key': cfg.key };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  const r = await fetch(cfg.url + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw new Error('La API rechazó la clave. Fijate que sea la misma ApiKey del stack 03.');
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).error || ''; } catch {}
    throw new Error(detail || `Error ${r.status} en ${path}`);
  }
  return r.json();
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (ts) => ts ? new Date(ts * 1000).toLocaleString('es-UY', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const label = { RUNNING: 'En línea', STARTING: 'Arrancando', STOPPING: 'Apagando', STOPPED: 'Apagado', ERROR: 'Error', CREATING: 'Creando', DELETING: 'Eliminando' };

async function render() {
  let servers;
  try { servers = await api('/servers'); }
  catch (e) { showConfig(e.message); return; }
  if (!servers.length) {
    app.innerHTML = `<div class="msg">Todavía no hay servidores. Creá el primero con el botón <b>Nuevo servidor</b>.</div>`;
    return;
  }
  app.innerHTML = servers.map(card).join('');
  for (const s of servers) {
    const el = document.getElementById('srv-' + s.name);
    el.querySelector('[data-act]')?.addEventListener('click', (ev) => act(s, ev.currentTarget.dataset.act));
    el.querySelector('[data-copy]')?.addEventListener('click', () => copy(s.address + ':2456'));
    el.querySelector('[data-events]')?.addEventListener('click', () => toggleEvents(s.name));
    el.querySelector('[data-del]')?.addEventListener('click', () => { confirmDelete.add(s.name); render(); });
    el.querySelector('[data-del-no]')?.addEventListener('click', () => { confirmDelete.delete(s.name); render(); });
    el.querySelector('[data-del-yes]')?.addEventListener('click', () => removeServer(s));
    if (openEvents.has(s.name)) loadEvents(s.name);
  }
}

function card(s) {
  const st = s.status || 'STOPPED';
  const busy = ['STARTING', 'STOPPING', 'CREATING', 'DELETING'].includes(st);
  const provisioning = st === 'CREATING' || st === 'DELETING';
  const noStart = provisioning || s.noAsg;  // sin ASG (stack en curso o fallido): no se puede iniciar
  const canDelete = (st === 'STOPPED' || st === 'ERROR') && !s.desired && !s.instances;
  const action = (st === 'STOPPED' || st === 'ERROR') ? { act: 'start', txt: 'Prender servidor' } : { act: 'stop', txt: 'Apagar servidor' };
  const msg = cardMsg.get(s.name);
  return `
  <article class="card" id="srv-${esc(s.name)}">
    <div class="row">
      <div class="name">${esc(s.name)} <span class="sub">· mundo ${esc(s.world || '—')}</span></div>
      <span class="pill ${st}">${label[st] || st}${st === 'RUNNING' ? ` · ${s.players ?? 0} jugador${s.players === 1 ? '' : 'es'}` : ''}</span>
    </div>
    ${st === 'ERROR' && s.error ? `<div class="msg err">${esc(s.error)}</div>` : ''}
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
    ${noStart ? `<div class="sub">${st === 'CREATING' ? 'CloudFormation está armando el balanceador, el Auto Scaling Group y la alarma, tarda unos 3 minutos. Cuando termina queda Apagado, listo para prender.' : st === 'DELETING' ? 'CloudFormation está borrando los recursos del servidor, unos 2 minutos. El mundo queda guardado en S3.' : 'La creación falló y CloudFormation deshizo lo que había creado. Podés borrar este registro y probar de nuevo.'}</div>` : `
    <div class="facts">
      <div><b>Dirección (Unirse por IP)</b>
        <div class="addr">${s.address ? `<code>${esc(s.address)}:2456</code><button class="link" data-copy>copiar</button>` : '<span class="sub">se muestra al estar en línea</span>'}</div></div>
      <div><b>Capacidad del ASG</b> deseada ${s.desired} · instancias ${s.instances}</div>
      <div><b>Último cambio</b> ${when(s.updated)}</div>
      <div><b>Último backup</b> ${s.lastBackup ? esc(s.lastBackup.split('/').pop()) : '—'}</div>
    </div>`}
    <div class="actions">
      ${noStart ? (provisioning ? `<button disabled>${label[st]}…</button>` : '') : `<button class="${action.act === 'start' ? 'primary' : ''}" data-act="${action.act}" ${busy ? 'disabled' : ''}>${busy ? label[st] + '…' : action.txt}</button>`}
      <button class="link" data-events>${openEvents.has(s.name) ? 'Ocultar historial' : 'Ver historial'}</button>
      ${canDelete && !confirmDelete.has(s.name) ? `<button class="link danger" data-del>Eliminar servidor</button>` : ''}
    </div>
    ${confirmDelete.has(s.name) ? `
    <div class="msg">¿Seguro que querés eliminar <b>${esc(s.name)}</b>? Se borran el balanceador y el Auto Scaling Group, el mundo <b>${esc(s.world || '')}</b> queda en S3 y se restaura si después creás otro servidor con ese mundo.
      <div class="actions" style="margin-top:10px"><button class="danger" data-del-yes>Sí, eliminar</button><button data-del-no>Cancelar</button></div></div>` : ''}
    <div class="events" id="ev-${esc(s.name)}" ${openEvents.has(s.name) ? '' : 'hidden'}></div>
  </article>`;
}

async function act(s, what) {
  const btn = document.querySelector(`#srv-${CSS.escape(s.name)} [data-act]`);
  btn.disabled = true; btn.textContent = what === 'start' ? 'Prendiendo…' : 'Apagando…';
  cardMsg.delete(s.name);
  try { await api(`/servers/${encodeURIComponent(s.name)}/${what}`, 'POST'); }
  catch (e) { cardMsg.set(s.name, e.message); }
  setTimeout(render, 800);
}

async function removeServer(s) {
  confirmDelete.delete(s.name); cardMsg.delete(s.name);
  try { await api(`/servers/${encodeURIComponent(s.name)}`, 'DELETE'); }
  catch (e) { cardMsg.set(s.name, e.message); }
  setTimeout(render, 800);
}

function showCreate() {
  if (createBox.innerHTML) { createBox.innerHTML = ''; return; }
  createBox.innerHTML = `
    <div class="card gold">
      <div class="name">Nuevo servidor</div>
      <div class="sub">Arma un stack de CloudFormation con su propio balanceador, Auto Scaling Group y alarma. Tarda unos 3 minutos y queda apagado hasta que lo prendas.</div>
      <form class="cfg" id="createForm" autocomplete="off">
        <div class="two">
          <label><span>Nombre del servidor</span>
            <input id="cName" required pattern="[a-z][a-z0-9-]{2,17}" placeholder="clan-viernes" autocomplete="off" autocapitalize="none" spellcheck="false">
            <small>3 a 18 caracteres: minúsculas, números y guiones.</small></label>
          <label><span>Nombre del mundo</span>
            <input id="cWorld" required pattern="[A-Za-z0-9_-]{3,20}" value="Midgard" autocomplete="off" spellcheck="false">
            <small>Si ya existe en S3 lo restaura, si no lo crea nuevo.</small></label>
        </div>
        <div class="two">
          <label><span>Contraseña del juego</span>
            <input id="cPass" required type="password" minlength="5" maxlength="30" autocomplete="new-password">
            <small>5 a 30 caracteres, Valheim no deja que esté dentro del nombre.</small></label>
          <label><span>Tamaño de la instancia</span>
            <select id="cType">
              <option value="t3.large">t3.large · 8 GB (recomendado)</option>
              <option value="t3.medium">t3.medium · 4 GB (justo de memoria)</option>
              <option value="t3a.large">t3a.large · 8 GB (AMD)</option>
              <option value="m5.large">m5.large · 8 GB</option>
            </select>
            <small>El laboratorio de la UM permite hasta tamaño large.</small></label>
        </div>
        <div id="createMsg"></div>
        <div class="actions"><button class="primary" type="submit" id="createBtn">Crear servidor</button><button type="button" id="createCancel">Cancelar</button></div>
      </form>
    </div>`;
  document.getElementById('createCancel').onclick = () => { createBox.innerHTML = ''; };
  document.getElementById('createForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('createBtn'); const box = document.getElementById('createMsg');
    const body = { name: document.getElementById('cName').value.trim().toLowerCase(), world: document.getElementById('cWorld').value.trim(),
                   password: document.getElementById('cPass').value, instanceType: document.getElementById('cType').value };
    btn.disabled = true; btn.textContent = 'Creando…'; box.innerHTML = '';
    try {
      const r = await api('/servers', 'POST', body);
      createBox.innerHTML = `<div class="msg ok">Servidor <b>${esc(r.name)}</b> en creación (stack <code>${esc(r.stack)}</code>). En ~3 minutos aparece como "Apagado", listo para iniciar.</div>`;
      setTimeout(() => { if (createBox.querySelector('.msg.ok')) createBox.innerHTML = ''; }, 20000);
      render();
    } catch (err) {
      box.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Crear servidor';
    }
  };
  document.getElementById('cName').focus();
}

async function toggleEvents(name) {
  if (openEvents.has(name)) openEvents.delete(name); else openEvents.add(name);
  render();
}

async function loadEvents(name) {
  const box = document.getElementById('ev-' + name);
  try {
    const ev = await api(`/servers/${encodeURIComponent(name)}/events`);
    box.innerHTML = ev.length ? ev.map(e => `<div><time>${when(e.ts)}</time><span class="k">${esc(e.kind)}</span><span>${esc(e.detail)}</span></div>`).join('') : '<div class="sub">Sin eventos todavía.</div>';
  } catch (e) { box.innerHTML = `<div class="sub">${esc(e.message)}</div>`; }
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch { prompt('Copiá la dirección:', text); }
}

function start() {
  if (!cfg.url || !cfg.key) { showConfig(); return; }
  render();
  clearInterval(timer);
  timer = setInterval(render, 15000);
}

document.getElementById('refresh').onclick = render;
document.getElementById('reconfig').onclick = () => showConfig();
document.getElementById('newServer').onclick = () => { if (cfg.url && cfg.key) showCreate(); };
start();
</script>
</body>
</html>
