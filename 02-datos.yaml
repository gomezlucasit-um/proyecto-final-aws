AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Valheim gestión de servidores, 02 datos. Contiene el bucket donde guardamos con
  Martín los mundos y los backups (tanto de versionado y lifecycle como de eventos
  a EventBridge), el bucket del panel de administración y la tabla de DynamoDB.
  Decidimos aplicarle la protección contra borrado porque es el único que guarda estado.

Parameters:
  Project:
    Type: String
    Default: valheim
  OwnerTeam:
    Type: String
    Default: grupo-valheim
  BackupRetentionDays:
    Type: Number
    Default: 30
    Description: Cuántos días guardamos los backups (tienen prefijo backups/) y las versiones viejas de los mundos.

Resources:
  # ---------- Mundos y backups ----------
  WorldsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Project}-worlds-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # Cada archivo nuevo que entra al bucket avisa a EventBridge (evento Object Created), así registramos los backups
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expirar-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: !Ref BackupRetentionDays
          - Id: expirar-versiones-anteriores
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref BackupRetentionDays
          - Id: limpiar-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: owner:team, Value: !Ref OwnerTeam }
        - { Key: owner:environment, Value: dev }
        - { Key: cost-center, Value: facultad-aws }

  # ---------- Panel web ----------
  PanelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Project}-panel-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - { Key: owner:team, Value: !Ref OwnerTeam }
        - { Key: owner:environment, Value: dev }

  PanelBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PanelBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${PanelBucket.Arn}/*"

  # ---------- Estado ----------
  # Usamos una única tabla, la PK es SERVER#<nombre> y la SK es STATE para el estado actual
  # o EVENT#<fecha> para el historial. El índice ByStatus solo tiene los ítems STATE porque
  # son los únicos con el atributo status.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Project}-manager"
      BillingMode: PAY_PER_REQUEST
      # Con esto podemos volver la tabla a cualquier momento de los últimos 35 días si se rompiera algo, para mejor redundancia
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: updated, AttributeType: N }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: updated, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: owner:team, Value: !Ref OwnerTeam }
        - { Key: owner:environment, Value: dev }
        - { Key: cost-center, Value: facultad-aws }

Outputs:
  WorldsBucketName:
    Value: !Ref WorldsBucket
    Export: { Name: !Sub "${Project}-WorldsBucket" }
  WorldsBucketArn:
    Value: !GetAtt WorldsBucket.Arn
    Export: { Name: !Sub "${Project}-WorldsBucketArn" }
  PanelBucketName:
    Value: !Ref PanelBucket
    Export: { Name: !Sub "${Project}-PanelBucket" }
  PanelUrl:
    Description: URL del panel por HTTPS. Primero hay que subir al bucket el index.html ya realizado con anterioridad.
    Value: !Sub "https://${PanelBucket.RegionalDomainName}/index.html"
  PanelWebsiteUrl:
    Description: Endpoint del sitio web estático de S3, sólo por http.
    Value: !GetAtt PanelBucket.WebsiteURL
  TableName:
    Value: !Ref Table
    Export: { Name: !Sub "${Project}-TableName" }
